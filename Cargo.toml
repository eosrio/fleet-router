[workspace]
members = [".", "mock-ship"]

[package]
name = "fleet-router"
version = "0.6.0"
edition = "2021"
rust-version = "1.99"
description = "Reverse proxy and load balancer for the Antelope SHiP (State History Plugin) WebSocket protocol."
authors = ["Igor Lins e Silva", "EOS Rio"]
repository = "https://github.com/eosrio/fleet-router"
homepage = "https://eosrio.github.io/fleet-router/"
documentation = "https://github.com/eosrio/fleet-router#readme"
readme = "README.md"
license = "MIT"
categories = ["network-programming"]
keywords = ["antelope", "ship", "state-history", "load-balancer", "websockets"]
# Keep the published crate lean: ship only what's needed to build and run the
# binary (including the embedded dashboard under ui/). Tests, Docker assets,
# the TypeScript client, and CI config stay in git.
include = [
    "build.rs",
    "src/**/*.rs",
    "ui/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "example.config.json",
]

[dependencies]
anyhow = "1.0.82"
# Refcounted frame buffers, so head/LIB can be patched in place without a copy
# when the frame is uniquely owned. Already in the tree through tungstenite.
bytes = "1"
chrono = "0.4.37"
clap = { version = "4.5.4", features = ["derive", "string", "wrap_help", "unicode"] }
color-print = "0.3.5"
futures = { version = "0.3.30", features = ["compat"] }
rs_abieos = { version = "0.6.0", default-features = false, features = ["rust-backend"] }
http = "1.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tokio = { version = "1.37.0", features = ["full"] }
# `rustls-tls-native-roots` dials `wss://` and verifies the upstream against the
# OS trust store (`SSL_CERT_FILE` / `SSL_CERT_DIR` replace it when set).
# tokio-tungstenite does not select a rustls CryptoProvider. aws-lc-rs is the
# provider already in this tree (reqwest 0.13). OpenSSL is not used.
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }

[dev-dependencies]
mock-ship = { path = "mock-ship" }
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "aws-lc-rs"] }
serde_json = "1"
